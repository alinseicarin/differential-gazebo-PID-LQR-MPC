# Finite-horizon time-varying LQR for the common timed trajectory experiment.
#
# Q and R started from Bryson-style error/correction scales. This commissioned
# configuration is frozen for the final comparison: it completed the nominal
# straight, circle, and figure-eight trials and the complete disturbance suite
# without angular saturation. Do not retune it from the reserved comparison
# seeds, because that would leak evaluation data into controller design.
lqr_node:
  ros__parameters:
    use_sim_time: true

    lqr_longitudinal_error_weight: 100.0
    lqr_lateral_error_weight: 400.0
    lqr_heading_error_weight: 100.0
    lqr_linear_correction_weight: 125.0
    lqr_angular_correction_weight: 15.625
    lqr_terminal_weight_multiplier: 10.0

    # Identical timed-reference policy to the cascaded PID configuration.
    search_window: 20
    reference_linear_velocity: 0.4
    curvature_speed_gain: 0.5
    endpoint_slowdown_distance: 0.0
    maximum_reference_curvature: 5.0
    trajectory_spatial_step: 0.01
    maximum_reference_linear_acceleration: 0.5
    maximum_reference_linear_deceleration: 0.1
    maximum_reference_angular_velocity: 1.5

    # Identical timing, completion, actuator limits, and emergency guard.
    nominal_control_frequency: 30.0
    max_control_dt: 0.2
    goal_tolerance: 0.08
    goal_heading_tolerance: 0.15
    max_linear_velocity: 1.0
    max_angular_velocity: 1.5
    translation_stop_lateral_error: 0.75
    translation_stop_heading_error: 1.2
    odom_timeout: 2.0
    startup_settling_time: 1.0
