# Conservative tuning intended for corners, model mismatch, and disturbances.
# Lower longitudinal gains reduce aggressive acceleration. Extra angular
# damping and a small integral term improve heading recovery under persistent
# bias, while its tighter integral limit restricts windup.
pid_node:
  ros__parameters:
    use_sim_time: true
    controller_mode: lookahead

    linear_kp: 0.8
    linear_ki: 0.05
    linear_kd: 0.3
    linear_integral_limit: 0.8

    angular_kp: 1.8
    angular_ki: 0.02
    angular_kd: 0.45
    angular_integral_limit: 0.4

    lookahead_points: 5
    search_window: 20
    reference_linear_velocity: 0.4
    curvature_speed_gain: 0.5
    endpoint_slowdown_distance: 0.5
    maximum_reference_curvature: 5.0
    nominal_control_frequency: 30.0
    max_control_dt: 0.2
    goal_tolerance: 0.08
    max_linear_velocity: 1.0
    max_angular_velocity: 1.5
    odom_timeout: 2.0
    startup_settling_time: 1.0
