# robot_localization EKF configuration for planar differential-drive motion.
#
# Sensor configuration arrays always use this 15-state order:
# [x, y, z, roll, pitch, yaw,
#  vx, vy, vz, vroll, vpitch, vyaw,
#  ax, ay, az]
# A true entry fuses that variable from the corresponding sensor message.
ekf_filter_node:
  ros__parameters:
    # Match the controller and Gazebo plugin update frequency in simulation time.
    frequency: 30.0
    # Stop predicting indefinitely if all configured sensor inputs become stale.
    sensor_timeout: 0.2
    # Constrain z, roll, pitch, and their derivatives for ground-plane motion.
    two_d_mode: true
    # The EKF, rather than Gazebo, owns the odom -> base_footprint transform.
    publish_tf: true
    # Permit clean recovery when Gazebo resets /clock backwards.
    reset_on_time_jump: true

    # world_frame=odom selects locally continuous odometry without a global map
    # correction source. map_frame is declared for robot_localization's frame
    # model but is not published by this local EKF configuration.
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # -----------------------------------------------------------------------
    # Sensor 1: wheel-encoder odometry integrated by gazebo_ros_diff_drive
    # -----------------------------------------------------------------------
    odom0: /odom
    # Fuse body velocities rather than both pose and velocities derived from the
    # same wheel rotations. This avoids counting one encoder measurement twice.
    # The measured vy=0 is useful information: a differential-drive robot cannot
    # translate sideways in its body frame. Pose and yaw are propagated by the
    # EKF from these velocities and the IMU measurements below.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    # The encoder message is already integrated, but its pose fields are not
    # fused; differential mode therefore remains disabled.
    odom0_differential: false

    # -----------------------------------------------------------------------
    # Sensor 2: simulated chassis IMU
    # -----------------------------------------------------------------------
    imu0: /demo/imu
    # Fuse yaw rate and longitudinal acceleration. Absolute IMU orientation is
    # deliberately excluded because Gazebo supplies it from the exact simulated
    # attitude; using it would reintroduce privileged world-state information.
    # Roll and pitch remain constrained by two_d_mode.
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    # Orientation is unused, but keep the sensor interpretation explicit.
    imu0_differential: false
    # Remove the gravity vector before fusing linear acceleration.
    imu0_remove_gravitational_acceleration: true
